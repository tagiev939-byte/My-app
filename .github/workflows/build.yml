name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    name: Unsigned IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (no code signing)
        run: |
          set -o pipefail
          xcodebuild -project AssemblyEmpire.xcodeproj \
            -target AssemblyEmpire \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | grep -E "error:|warning: unre|BUILD|\*\*" || true
          test -d build/Release-iphoneos/AssemblyEmpire.app

      - name: Package IPA
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Release-iphoneos/AssemblyEmpire.app Payload/
          zip -qry AssemblyEmpire.ipa Payload
          ls -lh AssemblyEmpire.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AssemblyEmpire-ipa
          path: AssemblyEmpire.ipa

      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest AssemblyEmpire.ipa \
            --target "${{ github.sha }}" \
            --title "Assembly Empire — последняя сборка" \
            --notes "Неподписанный IPA. Установите через Sideloadly или AltStore. Сборка: ${{ github.sha }}"

  screenshots:
    name: Simulator screenshots
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project AssemblyEmpire.xcodeproj \
            -target AssemblyEmpire \
            -configuration Debug \
            -sdk iphonesimulator ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | grep -E "error:|BUILD|\*\*" || true
          test -d build/Debug-iphonesimulator/AssemblyEmpire.app

      - name: Run QA scenarios
        run: |
          APP=build/Debug-iphonesimulator/AssemblyEmpire.app
          codesign --force --sign - --timestamp=none "$APP" || true
          UDID=$(python3 .github/scripts/pick_sim.py)
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          for s in title factory inspector build closeup land upgrades goals menu tutorial wide; do
            xcrun simctl launch --terminate-running-process \
              --stdout="$PWD/shots/$s.log" --stderr="$PWD/shots/$s.err" \
              "$UDID" com.tagiev.assemblyempire -scenario "$s" || echo "launch failed: $s"
            sleep 10
            xcrun simctl io "$UDID" screenshot "shots/$s.png" || true
          done
          ls -la shots

      - name: Publish screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p shots
          { for f in shots/*.log shots/*.err; do echo "=== $f"; cat "$f"; done; } > shots/logs.txt 2>/dev/null || true
          grep -E "error:|warning:" build.log | sort -u | head -200 > shots/build-issues.txt 2>/dev/null || true
          echo "end" >> shots/build-issues.txt
          rm -f shots/*.log shots/*.err
          find shots -size 0 -delete
          ls -la shots
          gh release delete screens --yes --cleanup-tag || true
          gh release create screens shots/* --prerelease \
            --target "${{ github.sha }}" \
            --title "QA screenshots" \
            --notes "Simulator screenshots for ${{ github.sha }}"
